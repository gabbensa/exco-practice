apiVersion: apps/v1
kind: Deployment
metadata:
  name: exco-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: exco-app
  template:
    metadata:
      labels:
        app: exco-app
    spec:
      containers:
        - name: exco-app
          image: exco-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
